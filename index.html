<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Igor Agenor Piovezan</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1a1a17;
      --muted: #5c5a54;
      --paper: #f4f1ea;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      max-width: 36rem;
      text-align: center;
    }

    .hello {
      margin-bottom: 0.75rem;
      color: var(--muted);
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3.25rem);
      font-weight: 500;
      line-height: 1.15;
    }
  </style>
</head>
<body>
  <main>
    <p class="hello">Hello world</p>
    <h1>Igor Agenor Piovezan</h1>
  </main>
</body>
</html>
